<style>
/* thaiput v8 · giao diện 5O (bản đen trắng, thay bản 19/10).
   Ngôn ngữ thiết kế theo ảnh thương hiệu: nền trắng, nét đen; màu chính là ĐEN TRẮNG (nút chính, mục đang chọn là
   viên thuốc đen chữ trắng); vàng thương hiệu (vàng chùa Thái trong logo) chỉ dùng cho dấu hiệu nhận diện (ô chữ Thái,
   thẻ gói học); màu phụ là xanh lá, tím, vàng, xanh dương dạng phấn cho trạng thái. Khối bo góc, nền chuyển từ xám
   sang trắng, ĐỔ BÓNG THAY VIỀN. Một phông duy nhất Be Vietnam Pro, giờ và số dùng chữ số đều cột.
   Chỉ giao diện sáng (không có chế độ tối). Điểm nhớ: thẻ gói học màu vàng bơ có chữ Thái พูด (nói) chìm phía sau.
   Chỉ đổi cách hiển thị: mọi class, id, cấu trúc trang giữ nguyên như bản trước. */
:root {
  /* Nền và bề mặt: trắng là chính, xám ấm rất nhạt cho lớp lót */
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f6f6f3;
  --surface-3: #ebebe7;
  --ink: #141414;
  --ink-2: #3d3d3a;
  --muted: #63635d;
  --line: #ececea;
  --line-strong: #d6d6d1;
  /* Thương hiệu 5O: đen cho nút chính, mục đang chọn; vàng thương hiệu cho dấu nhận diện */
  --brand: #141414;
  --brand-2: #2e2e2c;
  --brand-ink: #ffffff;
  --brand-soft: #fff1bf;
  --yellow: #ffc933;
  --yellow-ink: #141414;
  --gold: #8f6b00;
  --gold-soft: #fff1bf;
  --gold-ink: #6e5300;
  --mark-ink: #141414;
  /* Màu phấn (nền thẻ, nhãn trạng thái) */
  --mint: #d9f0d2;
  --butter: #ffefb8;
  --lavender: #e6e0fa;
  --lavender-ink: #4c3fb0;
  --lavender-strong: #5b4ed6;
  --blush: #fbe2de;
  --sky: #dcecfa;
  /* Trạng thái */
  --on-bad: #ffffff;
  --ok: #1e6f3e;
  --ok-soft: #ddf0da;
  --warn: #8a5f00;
  --warn-soft: #fff0c0;
  --bad: #b3261e;
  --bad-soft: #fce4e1;
  --info: #4c3fb0;
  --focus: #2f6fd1;
  --zalo: #0068ff;
  --overlay: rgba(14, 14, 14, .45);
  /* Chữ: một phông cho mọi thứ; số dùng chữ số đều cột (font-variant-numeric), không dùng phông đơn cách */
  --font-display: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-body: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-mono: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-thai: 'Noto Sans Thai Looped', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
  /* Bo góc: khối lớn 24, thẻ 18, ô nhập 14, ô giờ 12, viên thuốc 999 */
  --radius-xl: 24px;
  --radius: 18px;
  --radius-sm: 14px;
  --radius-xs: 12px;
  /* Đổ bóng thay viền (5O): khối trên nền trắng tách bằng bóng mềm; bóng lớn cho thứ nổi (hộp thoại, thanh tab, thanh hành động) */
  --shadow: 0 1px 2px rgba(20, 20, 20, .05), 0 10px 28px rgba(20, 20, 20, .08);
  --shadow-lg: 0 12px 36px rgba(20, 20, 20, .16), 0 2px 6px rgba(20, 20, 20, .08);
}
/* Chỉ một giao diện sáng (19/10): không đổi màu theo chế độ tối của máy; trình duyệt cũng không tự đảo màu ô nhập, thanh cuộn. */
:root { color-scheme: light only; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 116px; min-height: 100vh; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.025em; }
h2 { font-size: 1.32rem; font-weight: 700; letter-spacing: -.018em; }
h3 { font-size: 1rem; font-weight: 600; letter-spacing: -.005em; }
p { margin: 0; }
a { color: var(--brand); text-underline-offset: 3px; }
small, .muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.005em; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.spread > *, .row > * { min-width: 0; }
/* Nhãn nhỏ phía trên: chữ thường, không viết hoa toàn bộ */
.eyebrow { font-size: .8rem; color: var(--muted); font-weight: 500; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
[hidden] { display: none !important; }
#back { align-self: flex-start; }
/* Chừa chỗ ở cuối trang cho vật nổi (thanh tab, nút Zalo, thanh hành động) để nội dung cuối không bị che khi cuộn hết */
body:has(.fab-zalo.above-tabs) #app { padding-bottom: 160px; }
body:has(.actionbar:not([hidden])) #app { padding-bottom: 228px; }
/* Trình duyệt cũ không hiểu :has(): luôn chừa chỗ và đặt nút Zalo cao hơn thanh hành động (chỉ điện thoại) */
@supports not selector(:has(a)) {
  @media (max-width: 899px) { #app { padding-bottom: 228px; } .fab-zalo.above-tabs { bottom: calc(166px + env(safe-area-inset-bottom, 0px)); } }
}
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.ic { stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Thanh đầu trang: logo, nút VI | EN, nút phụ */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px; margin-inline: -16px; padding-inline: 16px; }
.brand { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); letter-spacing: -.01em; }
.brand .mark { width: 36px; height: 36px; border-radius: 12px; background: var(--yellow); color: var(--mark-ink); display: grid; place-items: center; font: 600 1.1rem/1 var(--font-thai); }
.topbar-right { flex-wrap: nowrap; gap: 8px; }
.topbar-right .who { font-size: .84rem; color: var(--muted); max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.langsw { appearance: none; display: inline-flex; align-items: center; border: 0; background: var(--surface-2); border-radius: 999px; padding: 3px; cursor: pointer; font: 600 .74rem/1 var(--font-body); letter-spacing: .03em; min-height: 36px; }
.langsw span { padding: 7px 10px; border-radius: 999px; color: var(--muted); }
.langsw span.on { background: var(--brand); color: var(--brand-ink); }

/* Bề mặt: khối trắng bo lớn đặt trên nền xám lá, không viền */
.card { background: var(--surface); border: 0; border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.panel { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; color: var(--ink-2); }
.card .panel, .sheet .panel { background: var(--surface-2); }
.note { background: var(--butter); border-radius: var(--radius-sm); padding: 12px 14px; font-size: .9rem; color: var(--ink-2); }
.alert { border-radius: var(--radius-sm); padding: 12px 14px; font-size: .92rem; border: 0; background: var(--surface-2); color: var(--ink-2); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }

/* Nút: viên thuốc. Chính: xanh rừng đậm. Phụ: nền trắng viền mảnh. */
.btn { appearance: none; border: 1px solid transparent; border-radius: 999px; padding: 11px 20px; font: 600 .94rem/1.2 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 46px; transition: background .15s, border-color .15s, color .15s; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand-2); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--ink-2); }
.btn-danger { background: var(--surface); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 7px 14px; font-size: .84rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible, .tab:focus-visible, .langsw:focus-visible, .nrow:focus-visible, .seg button:focus-visible, .person:focus-visible, .brand:focus-visible, .pkg:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Ô nhập */
label.field { display: flex; flex-direction: column; gap: 7px; font-weight: 600; font-size: .88rem; color: var(--ink-2); }
input[type=text], input[type=email], input[type=tel], input[type=search], select { width: 100%; font: 400 1rem/1.3 var(--font-body); padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); min-height: 48px; transition: border-color .15s; }
input[type=text]:hover, input[type=email]:hover, input[type=tel]:hover, input[type=search]:hover, select:hover { border-color: var(--ink-2); }
input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
input.invalid { border-color: var(--bad); background: color-mix(in srgb, var(--bad-soft) 40%, var(--surface)); }
.hint { font-weight: 400; font-size: .8rem; color: var(--muted); }
.hint.bad { color: var(--bad); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .86rem; color: var(--ink-2); }
.check input { margin-top: 2px; width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
.file { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 16px; text-align: center; color: var(--muted); font-size: .9rem; cursor: pointer; display: block; background: var(--surface-2); }
.file:hover { border-color: var(--ink-2); }
.file.has { border-style: solid; border-color: transparent; color: var(--ok); background: var(--ok-soft); }
.file input { display: none; }

/* Gói học (form đăng ký) */
.pkg-list { display: grid; gap: 10px; }
.pkg { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1.5px solid transparent; border-radius: var(--radius); padding: 14px 16px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
.pkg:hover { border-color: var(--line-strong); }
.pkg input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; }
.pkg.on { border-color: var(--brand); background: var(--butter); }
.pkg .price { font-weight: 700; white-space: nowrap; color: var(--ink); letter-spacing: -.01em; }
.pkg .meta { font-size: .8rem; color: var(--muted); }
.pkg.on .meta { color: var(--ink-2); }

/* Thẻ gói của học viên: thẻ vàng bơ theo ảnh thương hiệu, chữ Thái พูด chìm phía sau (điểm nhớ của thương hiệu) */
.pass { position: relative; overflow: hidden; border-radius: var(--radius-xl); padding: 20px 20px 18px; background: var(--butter); color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.pass::after { content: 'พูด'; position: absolute; right: -4px; bottom: -26px; font: 600 6.2rem/1 var(--font-thai); color: color-mix(in srgb, var(--brand) 9%, transparent); pointer-events: none; }
.pass > * { position: relative; z-index: 1; }
.pass .label { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.pass .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.pass .dates { display: flex; gap: 18px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-2); }
.pass .dates b { font-weight: 700; color: var(--ink); }
/* Nhãn trạng thái: viên thuốc màu phấn, chữ đậm cùng tông */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: .75rem; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); }
.pill.info { background: var(--lavender); color: var(--lavender-ink); }
.lesson .body > .pill, .sheet .lesson .pill { align-self: flex-start; }
.spread > .pill { flex: none; }
.lesson .body > .spread { flex-wrap: wrap; row-gap: 6px; }
.pass small, .pass .muted { color: var(--ink-2); }
.pass .pass-note { display: block; margin-top: 6px; font-size: .85rem; }
/* Chunk 5J: buổi quá hạn chọn kết quả (trang tutor), thông báo tuần sau (trang học viên) */
.lesson.is-overdue .when { outline: 2px solid var(--bad, #b42318); outline-offset: 2px; }
.alert.overdue { margin-top: 8px; font-size: .85rem; }
.week-banner .row { margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.pass .pill { background: rgba(255, 255, 255, .7); color: var(--ink); }

/* Ngày và giờ */
.day { background: var(--surface); border: 0; border-radius: var(--radius-xl); box-shadow: var(--shadow); }
.day > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.day > summary::-webkit-details-marker { display: none; }
.day > summary b { font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; }
.day[open] > summary { padding-bottom: 12px; }
.day .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; padding: 0 16px 16px; }
.chip { appearance: none; border: 1.5px solid transparent; background: var(--surface-2); color: var(--ink); border-radius: var(--radius-xs); padding: 10px 4px; font: 600 .92rem/1 var(--font-mono); font-variant-numeric: tabular-nums; cursor: pointer; text-align: center; min-height: 42px; transition: background .12s, border-color .12s, color .12s; }
.chip:hover:not(:disabled) { border-color: var(--ink-2); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.chip.pending { background: var(--butter); border-color: transparent; color: var(--warn); }
.chip.blocked, .chip.blocked:disabled { background: var(--blush); border-color: transparent; color: var(--bad); opacity: 1; text-decoration: line-through; }
.chip.booked { background: var(--mint); border-color: transparent; color: var(--ok); box-shadow: inset 0 -3px 0 var(--ok); }
.chip.dirty { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--lavender-strong); }
.chip:disabled { opacity: 1; color: #7d847e; cursor: not-allowed; }
.chip.on:disabled { background: #4b4b48; border-color: #4b4b48; color: #ffffff; }
.chip.booked:disabled { background: #e3f5de; color: #2f6b45; }
.chip.pending:disabled { color: #8a530c; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .78rem; }
.legend .chip { min-height: 30px; padding: 6px 12px; border-radius: 999px; font: 600 .76rem/1 var(--font-body); cursor: default; }
.legend .chip:not(.on):not(.pending):not(.blocked):not(.booked) { background: var(--surface-2); border-color: transparent; }

/* Buổi học: ô ngày giờ màu oải hương bên trái */
.lesson { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.lesson .when { font-family: var(--font-mono); font-weight: 600; text-align: center; background: var(--lavender); border-radius: var(--radius-sm); padding: 9px 10px; min-width: 74px; line-height: 1.25; color: var(--lavender-ink); font-size: .86rem; }
.lesson .when .d { display: block; font: 600 .72rem/1.2 var(--font-body); color: var(--lavender-ink); }
.lesson .when b { display: block; font-size: 1.12rem; color: var(--ink); letter-spacing: -.01em; }
.lesson .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.list-divider { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Thanh tab (điện thoại): thanh nổi bo tròn ở đáy, mục đang chọn là viên thuốc xanh rừng */
.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg); }
.tabbar .inner { max-width: 536px; margin: 0 auto; padding: 6px; gap: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; }
.tab { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 .72rem/1.2 var(--font-body); padding: 8px 4px 9px; border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; transition: background .15s, color .15s; }
.tab .ic { line-height: 1; }
.tab > span { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .tab { padding-inline: 2px; font-size: .69rem; letter-spacing: -.01em; } }
@media (max-width: 350px) { .tab { font-size: .62rem; } .tab > span { white-space: normal; text-align: center; } }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--brand); color: var(--brand-ink); }
.tab .count { position: static; margin-left: 4px; display: inline-block; vertical-align: 1px; min-width: 18px; padding: 1px 6px; border-radius: 999px; background: var(--lavender-strong); color: #ffffff; font-size: .66rem; line-height: 1.35; text-align: center; font-weight: 700; }
/* Điện thoại: 6 ô số liệu thành một hàng cuộn ngang, không chiếm nửa màn hình */
/* Tab có biểu tượng: số đếm nằm ở góc biểu tượng, không đẩy chữ xuống dòng */
.tab .ic ~ span .count { position: absolute; top: 2px; left: calc(50% + 10px); margin-left: 0; }

/* Thanh hành động nổi (đã chọn giờ, lưu giờ rảnh) */
.actionbar { position: fixed; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 10; padding-inline: 12px; }
.actionbar .inner { max-width: 536px; margin: 0 auto; background: var(--brand); color: var(--brand-ink); border-radius: 22px; padding: 10px 10px 10px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); }
.actionbar .btn-primary { background: var(--brand-ink); color: var(--brand); }
.actionbar .btn-primary:hover { background: color-mix(in srgb, var(--brand-ink) 88%, var(--brand)); }
.actionbar .btn-ghost { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 35%, transparent); }

/* Liên hệ admin, nút Zalo nổi (giữ màu Zalo để nhận ra ngay) */
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.contact .btn { min-height: 44px; font-size: .86rem; }
.contact:has(> :only-child) { grid-template-columns: 1fr; }
.zalo { color: var(--zalo); border-color: color-mix(in srgb, var(--zalo) 45%, transparent); }
.fab-zalo { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 15; background: #0068ff; color: #fff; border-radius: 999px; padding: 13px 18px; font: 700 .88rem/1 var(--font-body); text-decoration: none; box-shadow: var(--shadow-lg); }
.fab-zalo.above-tabs { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
body:has(.actionbar:not([hidden])) .fab-zalo.above-tabs { bottom: calc(166px + env(safe-area-inset-bottom, 0px)); }

/* Hộp thoại trong trang */
.sheet-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 28px 28px 0 0; padding: 24px 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.sheet::before { content: ''; align-self: center; width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); margin-top: -10px; }
.langpick h2 { font-size: 1.3rem; }
.sheet > .pill { align-self: flex-start; }
