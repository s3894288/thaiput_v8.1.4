<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title>thaiput · Đặt lịch luyện nói · Speaking lessons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Thai:wght@600&family=Noto+Sans+Thai+Looped:wght@600&display=swap">
  <style>
/* thaiput v8 · giao diện 5O (bản đen trắng, thay bản 19/10).
   Ngôn ngữ thiết kế theo ảnh thương hiệu: nền trắng, nét đen; màu chính là ĐEN TRẮNG (nút chính, mục đang chọn là
   viên thuốc đen chữ trắng); vàng thương hiệu (vàng chùa Thái trong logo) chỉ dùng cho dấu hiệu nhận diện (ô chữ Thái,
   thẻ gói học); màu phụ là xanh lá, tím, vàng, xanh dương dạng phấn cho trạng thái. Khối bo góc, nền chuyển từ xám
   sang trắng, ĐỔ BÓNG THAY VIỀN. Một phông duy nhất Be Vietnam Pro, giờ và số dùng chữ số đều cột.
   Chỉ giao diện sáng (không có chế độ tối). Điểm nhớ: thẻ gói học màu vàng bơ có chữ Thái พูด (nói) chìm phía sau.
   Chỉ đổi cách hiển thị: mọi class, id, cấu trúc trang giữ nguyên như bản trước. */
:root {
  /* Nền và bề mặt: trắng là chính, xám ấm rất nhạt cho lớp lót */
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f6f6f3;
  --surface-3: #ebebe7;
  --ink: #141414;
  --ink-2: #3d3d3a;
  --muted: #63635d;
  --line: #ececea;
  --line-strong: #d6d6d1;
  /* Thương hiệu 5O: đen cho nút chính, mục đang chọn; vàng thương hiệu cho dấu nhận diện */
  --brand: #141414;
  --brand-2: #2e2e2c;
  --brand-ink: #ffffff;
  --brand-soft: #fff1bf;
  --yellow: #ffc933;
  --gold: #8f6b00;
  --gold-soft: #fff1bf;
  --gold-ink: #6e5300;
  --mark-ink: #141414;
  /* Màu phấn (nền thẻ, nhãn trạng thái) */
  --mint: #d9f0d2;
  --butter: #ffefb8;
  --lavender: #e6e0fa;
  --lavender-ink: #4c3fb0;
  --lavender-strong: #5b4ed6;
  --blush: #fbe2de;
  --sky: #dcecfa;
  /* Trạng thái */
  --on-bad: #ffffff;
  --ok: #1e6f3e;
  --ok-soft: #ddf0da;
  --warn: #8a5f00;
  --warn-soft: #fff0c0;
  --bad: #b3261e;
  --bad-soft: #fce4e1;
  --info: #4c3fb0;
  --focus: #2f6fd1;
  --zalo: #0068ff;
  --overlay: rgba(14, 14, 14, .45);
  /* Chữ: một phông cho mọi thứ; số dùng chữ số đều cột (font-variant-numeric), không dùng phông đơn cách */
  --font-display: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-body: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-mono: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-thai: 'Noto Sans Thai Looped', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
  /* Bo góc: khối lớn 24, thẻ 18, ô nhập 14, ô giờ 12, viên thuốc 999 */
  --radius-xl: 24px;
  --radius: 18px;
  --radius-sm: 14px;
  --radius-xs: 12px;
  /* Đổ bóng thay viền (5O): khối trên nền trắng tách bằng bóng mềm; bóng lớn cho thứ nổi (hộp thoại, thanh tab, thanh hành động) */
  --shadow: 0 1px 2px rgba(20, 20, 20, .05), 0 10px 28px rgba(20, 20, 20, .08);
  --shadow-lg: 0 12px 36px rgba(20, 20, 20, .16), 0 2px 6px rgba(20, 20, 20, .08);
}
/* Chỉ một giao diện sáng (19/10): không đổi màu theo chế độ tối của máy; trình duyệt cũng không tự đảo màu ô nhập, thanh cuộn. */
:root { color-scheme: light only; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 116px; min-height: 100vh; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.025em; }
h2 { font-size: 1.32rem; font-weight: 700; letter-spacing: -.018em; }
h3 { font-size: 1rem; font-weight: 600; letter-spacing: -.005em; }
p { margin: 0; }
a { color: var(--brand); text-underline-offset: 3px; }
small, .muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.005em; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.spread > *, .row > * { min-width: 0; }
/* Nhãn nhỏ phía trên: chữ thường, không viết hoa toàn bộ */
.eyebrow { font-size: .8rem; color: var(--muted); font-weight: 500; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
[hidden] { display: none !important; }
#back { align-self: flex-start; }
/* Chừa chỗ ở cuối trang cho vật nổi (thanh tab, nút Zalo, thanh hành động) để nội dung cuối không bị che khi cuộn hết */
body:has(.fab-zalo.above-tabs) #app { padding-bottom: 160px; }
body:has(.actionbar:not([hidden])) #app { padding-bottom: 228px; }
/* Trình duyệt cũ không hiểu :has(): luôn chừa chỗ và đặt nút Zalo cao hơn thanh hành động (chỉ điện thoại) */
@supports not selector(:has(a)) {
  @media (max-width: 899px) { #app { padding-bottom: 228px; } .fab-zalo.above-tabs { bottom: calc(166px + env(safe-area-inset-bottom, 0px)); } }
}
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.ic { stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Thanh đầu trang: logo, nút VI | EN, nút phụ */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--bg); box-shadow: 0 1px 0 var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px; margin-inline: -16px; padding-inline: 16px; }
.brand { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); letter-spacing: -.01em; }
.brand .mark { width: 36px; height: 36px; border-radius: 12px; background: var(--yellow); color: var(--mark-ink); display: grid; place-items: center; font: 600 1.1rem/1 var(--font-thai); }
.topbar-right { flex-wrap: nowrap; gap: 8px; }
.topbar-right .who { font-size: .84rem; color: var(--muted); max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.langsw { appearance: none; display: inline-flex; align-items: center; border: 0; background: var(--surface-2); border-radius: 999px; padding: 3px; cursor: pointer; font: 600 .74rem/1 var(--font-body); letter-spacing: .03em; min-height: 36px; }
.langsw span { padding: 7px 10px; border-radius: 999px; color: var(--muted); }
.langsw span.on { background: var(--brand); color: var(--brand-ink); }

/* Bề mặt: khối trắng bo lớn trên nền trắng, tách bằng bóng mềm (đổ bóng thay viền, 5O) */
.card { background: var(--surface); border: 0; border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.panel { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; color: var(--ink-2); }
.card .panel, .sheet .panel { background: var(--surface-2); }
.note { background: var(--butter); border-radius: var(--radius-sm); padding: 12px 14px; font-size: .9rem; color: var(--ink-2); }
.alert { border-radius: var(--radius-sm); padding: 12px 14px; font-size: .92rem; border: 0; background: var(--surface-2); color: var(--ink-2); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }

/* Nút: viên thuốc. Chính: đen chữ trắng. Phụ: nền trắng viền mảnh. */
.btn { appearance: none; border: 1px solid transparent; border-radius: 999px; padding: 11px 20px; font: 600 .94rem/1.2 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 46px; transition: background .15s, border-color .15s, color .15s; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand-2); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--ink-2); }
.btn-danger { background: var(--surface); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 7px 14px; font-size: .84rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible, .tab:focus-visible, .langsw:focus-visible, .nrow:focus-visible, .seg button:focus-visible, .person:focus-visible, .brand:focus-visible, .pkg:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Ô nhập */
label.field { display: flex; flex-direction: column; gap: 7px; font-weight: 600; font-size: .88rem; color: var(--ink-2); }
input[type=text], input[type=email], input[type=tel], input[type=search], select { width: 100%; font: 400 1rem/1.3 var(--font-body); padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); min-height: 48px; transition: border-color .15s; }
input[type=text]:hover, input[type=email]:hover, input[type=tel]:hover, input[type=search]:hover, select:hover { border-color: var(--ink-2); }
input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
input.invalid { border-color: var(--bad); background: color-mix(in srgb, var(--bad-soft) 40%, var(--surface)); }
.hint { font-weight: 400; font-size: .8rem; color: var(--muted); }
.hint.bad { color: var(--bad); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .86rem; color: var(--ink-2); }
.check input { margin-top: 2px; width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
.file { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 16px; text-align: center; color: var(--muted); font-size: .9rem; cursor: pointer; display: block; background: var(--surface-2); }
.file:hover { border-color: var(--ink-2); }
.file.has { border-style: solid; border-color: transparent; color: var(--ok); background: var(--ok-soft); }
.file input { display: none; }

/* Gói học (form đăng ký) */
.pkg-list { display: grid; gap: 10px; }
.pkg { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1.5px solid transparent; border-radius: var(--radius); padding: 14px 16px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
.pkg:hover { border-color: var(--line-strong); }
.pkg input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; }
.pkg.on { border-color: var(--brand); background: var(--butter); }
.pkg .price { font-weight: 700; white-space: nowrap; color: var(--ink); letter-spacing: -.01em; }
.pkg .meta { font-size: .8rem; color: var(--muted); }
.pkg.on .meta { color: var(--ink-2); }

/* Thẻ gói của học viên: thẻ vàng bơ theo ảnh thương hiệu, chữ Thái พูด chìm phía sau (điểm nhớ của thương hiệu) */
.pass { position: relative; overflow: hidden; border-radius: var(--radius-xl); padding: 20px 20px 18px; background: var(--butter); color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.pass::after { content: 'พูด'; position: absolute; right: -4px; bottom: -26px; font: 600 6.2rem/1 var(--font-thai); color: color-mix(in srgb, var(--brand) 9%, transparent); pointer-events: none; }
.pass > * { position: relative; z-index: 1; }
.pass .label { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.pass .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.pass .dates { display: flex; gap: 18px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-2); }
.pass .dates b { font-weight: 700; color: var(--ink); }
/* Nhãn trạng thái: viên thuốc màu phấn, chữ đậm cùng tông */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: .75rem; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); }
.pill.info { background: var(--lavender); color: var(--lavender-ink); }
.lesson .body > .pill, .sheet .lesson .pill { align-self: flex-start; }
.spread > .pill { flex: none; }
.lesson .body > .spread { flex-wrap: wrap; row-gap: 6px; }
.pass small, .pass .muted { color: var(--ink-2); }
.pass .pass-note { display: block; margin-top: 6px; font-size: .85rem; }
/* Chunk 5J: buổi quá hạn chọn kết quả (trang tutor), thông báo tuần sau (trang học viên) */
.lesson.is-overdue .when { outline: 2px solid var(--bad, #b42318); outline-offset: 2px; }
.alert.overdue { margin-top: 8px; font-size: .85rem; }
.week-banner .row { margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.pass .pill { background: rgba(255, 255, 255, .7); color: var(--ink); }

/* Ngày và giờ */
.day { background: var(--surface); border: 0; border-radius: var(--radius-xl); box-shadow: var(--shadow); }
.day > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.day > summary::-webkit-details-marker { display: none; }
.day > summary b { font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; }
.day[open] > summary { padding-bottom: 12px; }
.day .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; padding: 0 16px 16px; }
.chip { appearance: none; border: 1.5px solid transparent; background: var(--surface-2); color: var(--ink); border-radius: var(--radius-xs); padding: 10px 4px; font: 600 .92rem/1 var(--font-mono); font-variant-numeric: tabular-nums; cursor: pointer; text-align: center; min-height: 42px; transition: background .12s, border-color .12s, color .12s; }
.chip:hover:not(:disabled) { border-color: var(--ink-2); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.chip.pending { background: var(--butter); border-color: transparent; color: var(--warn); }
.chip.blocked, .chip.blocked:disabled { background: var(--blush); border-color: transparent; color: var(--bad); opacity: 1; text-decoration: line-through; }
.chip.booked { background: var(--mint); border-color: transparent; color: var(--ok); box-shadow: inset 0 -3px 0 var(--ok); }
.chip.dirty { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--lavender-strong); }
.chip:disabled { opacity: 1; color: var(--muted); cursor: not-allowed; }
.chip.on:disabled { background: #4b4b48; border-color: #4b4b48; color: #ffffff; }
.chip.booked:disabled { background: var(--mint); color: var(--ok); }
.chip.pending:disabled { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .78rem; }
.legend .chip { min-height: 30px; padding: 6px 12px; border-radius: 999px; font: 600 .76rem/1 var(--font-body); cursor: default; }
.legend .chip:not(.on):not(.pending):not(.blocked):not(.booked) { background: var(--surface-2); border-color: transparent; }

/* Buổi học: ô ngày giờ màu oải hương bên trái */
.lesson { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.lesson .when { font-family: var(--font-mono); font-weight: 600; text-align: center; background: var(--lavender); border-radius: var(--radius-sm); padding: 9px 10px; min-width: 74px; line-height: 1.25; color: var(--lavender-ink); font-size: .86rem; }
.lesson .when .d { display: block; font: 600 .72rem/1.2 var(--font-body); color: var(--lavender-ink); }
.lesson .when b { display: block; font-size: 1.12rem; color: var(--ink); letter-spacing: -.01em; }
.lesson .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.list-divider { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Thanh tab (điện thoại): thanh nổi bo tròn ở đáy, mục đang chọn là viên thuốc đen */
.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg); }
.tabbar .inner { max-width: 536px; margin: 0 auto; padding: 6px; gap: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; }
.tab { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 .72rem/1.2 var(--font-body); padding: 8px 4px 9px; border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; transition: background .15s, color .15s; }
.tab .ic { line-height: 1; }
.tab > span { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .tab { padding-inline: 2px; font-size: .69rem; letter-spacing: -.01em; } }
@media (max-width: 350px) { .tab { font-size: .62rem; } .tab > span { white-space: normal; text-align: center; } }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--brand); color: var(--brand-ink); }
.tab .count { position: static; margin-left: 4px; display: inline-block; vertical-align: 1px; min-width: 18px; padding: 1px 6px; border-radius: 999px; background: var(--lavender-strong); color: #ffffff; font-size: .66rem; line-height: 1.35; text-align: center; font-weight: 700; }
/* Điện thoại: 6 ô số liệu thành một hàng cuộn ngang, không chiếm nửa màn hình */
/* Tab có biểu tượng: số đếm nằm ở góc biểu tượng, không đẩy chữ xuống dòng */
.tab .ic ~ span .count { position: absolute; top: 2px; left: calc(50% + 10px); margin-left: 0; }

/* Thanh hành động nổi (đã chọn giờ, lưu giờ rảnh) */
.actionbar { position: fixed; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 10; padding-inline: 12px; }
.actionbar .inner { max-width: 536px; margin: 0 auto; background: var(--brand); color: var(--brand-ink); border-radius: 22px; padding: 10px 10px 10px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); }
.actionbar .btn-primary { background: var(--brand-ink); color: var(--brand); }
.actionbar .btn-primary:hover { background: color-mix(in srgb, var(--brand-ink) 88%, var(--brand)); }
.actionbar .btn-ghost { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 35%, transparent); }

/* Liên hệ admin, nút Zalo nổi (giữ màu Zalo để nhận ra ngay) */
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.contact .btn { min-height: 44px; font-size: .86rem; }
.contact:has(> :only-child) { grid-template-columns: 1fr; }
.zalo { color: var(--zalo); border-color: color-mix(in srgb, var(--zalo) 45%, transparent); }
.fab-zalo { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 15; background: #0068ff; color: #fff; border-radius: 999px; padding: 13px 18px; font: 700 .88rem/1 var(--font-body); text-decoration: none; box-shadow: var(--shadow-lg); }
.fab-zalo.above-tabs { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

      (zalo ? '<a class="btn btn-ghost zalo" href="' + T.esc(zalo) + '" target="_blank" rel="noopener">' + T.t('a.zalo') + '</a>' : '') +
      (site ? '<a class="btn btn-ghost" href="' + T.esc(site) + '" target="_blank" rel="noopener">' + T.t('a.website') + '</a>' : '') + '</div>';
  };

  /** 5K (BL06): gói giá 0 không chọn được trên web; hiện thẻ gói kèm nút Zalo admin. */
  T.pkgContact = function (p) {
    var zalo = T.safeUrl(T.boot.zalo);
    return '<div class="pkg pkg-contact"><span><b>' + T.esc(T.pkgName(p)) + '</b><br><span class="meta">' + T.t('a.pkg_contact_note') + '</span></span>' +
      (zalo ? '<a class="btn btn-ghost zalo" href="' + T.esc(zalo) + '" target="_blank" rel="noopener">' + T.t('a.pkg_contact_btn') + '</a>' : '<span class="price">' + T.t('a.price_contact') + '</span>') + '</div>';
  };

  /** 5K: số điện thoại tự do (không cần định dạng, không bắt buộc), như server (Phone.gs). Trả chuỗi đã gọn, trống trả null. */
  T.phone = function (input) {
    var s = String(input || '').replace(/[\u0000-\u001f\u007f]+/g, ' ').replace(/\s+/g, ' ').trim();
    return s && s.length <= 40 ? s : null;   // quá 40 ký tự: báo ngay (server cắt còn 40 nếu lọt qua)
  };

  /** Đọc ảnh chụp chuyển khoản, thu nhỏ còn cạnh dài 1600px để gửi nhanh. PDF và ảnh không đọc được thì gửi nguyên. */
  T.readUpload = function (file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error(T.t('a.file_none')));
      if (file.size > 12 * 1024 * 1024) return reject(new Error(T.t('a.file_big')));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error(T.t('a.file_read'))); };
      fr.onload = function () {
        var dataUrl = String(fr.result), raw = { name: file.name, mimeType: file.type || 'application/octet-stream', base64: dataUrl.split(',')[1] };
        if (!/^image\/(png|jpe?g|webp)$/i.test(file.type)) return resolve(raw);
        var img = new Image(), done = false;
        // Dự phòng: trình duyệt không báo onload/onerror trong 8 giây thì gửi file gốc, không treo nút Gửi.
        var guard = setTimeout(function () { if (!done) { done = true; resolve(raw); } }, 8000);
        img.onload = function () {
          if (done) return; done = true; clearTimeout(guard);
          try {
            var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
            var c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            var out = c.toDataURL('image/jpeg', 0.82);
            resolve({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', base64: out.split(',')[1] });
          } catch (e) { resolve(raw); }
        };
        img.onerror = function () { if (!done) { done = true; clearTimeout(guard); resolve(raw); } };
        img.src = dataUrl;
      };
      fr.readAsDataURL(file);
    });
  };

  // ── Router ──
  // Chunk 5I: trang quản trị song ngữ như mọi trang (bỏ việc ép tiếng Việt của 5H).
  T.go = function (page, opts) {
    T.state.page = page; T.state.opts = opts || {};
    try { document.body.setAttribute('data-page', page); } catch (e) { }
    window.scrollTo(0, 0);
    var v = T.views[page] || T.views.home;
    v.render(T.root(), opts || {});
    T.fab(page);
    T.maint(page);
  };

  /** Thanh báo bảo trì (chunk 5G) trên mọi trang trừ admin: CONFIG MAINTENANCE_MODE READONLY hoặc CLOSED. Theo ngôn ngữ đang chọn. */
  T.maint = function (page) {
    var m = T.boot.maint || {}, el = document.getElementById('tp-maint');
    if (!m.mode || m.mode === 'OFF' || page === 'admin') { if (el) el.hidden = true; document.body.classList.remove('has-maint'); return; }
    if (!el) { el = document.createElement('div'); el.id = 'tp-maint'; el.className = 'maintbar'; el.setAttribute('role', 'status'); document.body.insertBefore(el, document.body.firstChild); }
    var k = m.mode === 'CLOSED' ? 'a.maint_closed' : 'a.maint_readonly', v = { until: m.until ? ' (' + m.until + ')' : '' };
    var mv = T.safeUrl(m.movedTo || '');   // 5L: hệ thống đã chuyển: chỉ báo link mới
    if (mv) el.innerHTML = T.esc(T.t('a.moved')) + ' <a href="' + T.esc(mv) + '">' + T.esc(mv) + '</a>'; else el.textContent = T.t(k, v);
    el.hidden = false; document.body.classList.add('has-maint');
  };
  /** Cổng đóng vì bảo trì: một trang báo, nút Zalo, nút đăng xuất. */
  T.maintScreen = function (res) {
    T.state.maintRes = res;
    var msg = res && typeof res === 'object' ? T.m(res) : res;
    var page = T.state.page, tutor = page === 'tutor';
    // Bố cục một cột như trang chủ (không chừa chỗ thanh tab bên trái trên máy tính, nút Zalo không nâng lên trên thanh tab).
    try { document.body.setAttribute('data-page', 'maint'); } catch (e) { }
    T.fab('maint');
    T.root().innerHTML = T.topbar('<button class="btn btn-ghost btn-sm" type="button" id="logout">' + T.t(tutor ? 't.logout' : 's.logout_full') + '</button>') +
      '<main class="stack-lg" id="maint-screen"><h1>' + T.t('a.maint_title') + '</h1><div class="alert warn">' + T.esc(msg || '') + '</div>' +
      (T.safeUrl((T.boot.maint || {}).movedTo || '') ? '<div class="alert">' + T.esc(T.t('a.moved')) + ' <a id="moved-link" href="' + T.esc(T.boot.maint.movedTo) + '">' + T.esc(T.boot.maint.movedTo) + '</a></div>' : '') +
      T.contact({ zalo: T.boot.zalo }) + '</main>';
    var b = document.getElementById('logout'); if (b) b.onclick = T.logout;
    T.maint(page);
  };

  /** Nút Zalo nổi ở góc dưới phải mọi trang (khi CONFIG có ADMIN_ZALO_URL). Nằm trên thanh tab ở cổng học viên và tutor. */
  T.fab = function (page) {
    var el = document.getElementById('tp-fab');
    var zalo = T.safeUrl(T.boot.zalo);
    if (!zalo || page === 'admin') { if (el) el.hidden = true; return; }   // admin không cần nút nhắn admin
    if (!el) { el = document.createElement('a'); el.id = 'tp-fab'; el.className = 'fab-zalo'; el.target = '_blank'; el.rel = 'noopener'; document.body.appendChild(el); }
    el.hidden = false; el.href = zalo; el.textContent = T.t('a.zalo_fab');
    el.setAttribute('aria-label', T.t('a.zalo'));
    el.classList.toggle('above-tabs', page === 'student' || page === 'tutor');
  };

  T.topbar = function (right) {
    // Bấm logo về trang chủ (vẫn giữ đăng nhập; trang chủ có nút "Vào lịch của tôi").
    return '<header class="topbar"><button type="button" class="brand" onclick="T.go(\'home\')" aria-label="' + T.esc(T.t('a.home_aria')) + '"><span class="mark" aria-hidden="true">พ</span><span>thaiput</span></button>' +
      '<div class="row topbar-right">' + T.langSwitch() + (right || '') + '</div></header>';
  };

  T.logout = function () {
    var tok = T.token();
    var pending = T.flushLang();   // lựa chọn ngôn ngữ vừa bấm tới máy chủ trước khi phiên bị huỷ
    T.session.clear();
    if (tok) pending.then(function () { T.api('apiLogout', tok); });
    T.go('login');
  };

  T.portalOf = function (role) { return role === 'TUTOR' ? 'tutor' : role === 'ADMIN' ? 'admin' : 'student'; };
  /** Chuỗi trình duyệt gửi lên khi đăng nhập, để máy chủ ghi tên thiết bị (Chrome · Windows) vào nhật ký và trang quản trị. */
  T.device = function () { try { return String(navigator.userAgent || '').substring(0, 400); } catch (e) { return ''; } };
  /** Bỏ mã link khỏi địa chỉ trang sau khi đăng nhập, để làm mới trang không đổi mã lần nữa (google.script.history của Apps Script). */
  T.cleanUrl = function (role) {
    try { if (window.google && google.script && google.script.history) google.script.history.replace(null, { page: T.portalOf(role) }, ''); } catch (e) { }
  };

  T.start = function () {
    var page = T.boot.page || 'home', s = T.session.get();
    // Ngôn ngữ ban đầu: lựa chọn đã lưu trên máy, rồi ngôn ngữ của phiên, rồi mặc định theo vai trò.
    T.setLang(T.storedLang() || (s && s.lang) || T.defaultLang(s && s.role), { local: true });
    if (page === 'auth' && T.boot.linkToken) return T.go('auth', { linkToken: T.boot.linkToken });
    if (page === 'gauth') return T.go('gauth');
    if ((page === 'student' || page === 'tutor' || page === 'admin' || page === 'login') && s && s.token) return T.go(T.portalOf(s.role));
    if ((page === 'student' || page === 'tutor' || page === 'admin' || page === 'renew') && !(s && s.token)) return T.go('login');
    if (page === 'renew') return T.go('student', { tab: 'account', renew: true });
    T.go(T.views[page] ? page : 'home');
  };
})();
</script>

  function pkgMeta(p) {
    if (p.code === 'TRIAL') return T.t('h.pkg_trial', { n: p.sessions, d: p.days });
    if (p.type === 'DAYS') return T.t('h.pkg_days', { d: p.days });
    return p.sessions ? T.t('h.pkg_sessions', { n: p.sessions }) : '';
  }

  function topBtn(s) {
    return s && s.token
      ? '<button class="btn btn-ghost btn-sm" type="button" id="go-portal">' + T.t('h.btn_portal') + '</button>'
      : '<button class="btn btn-ghost btn-sm" type="button" id="go-login">' + T.t('h.btn_login') + '</button>';
  }

  /** Trình độ: hiện theo ngôn ngữ đang chọn, giá trị gửi lên luôn là bản tiếng Việt cùng vị trí (Sheets lưu một thứ tiếng). */
  function levelOptions() {
    var vi = T.t('h.levels', null, 'vi').split('|');
    return T.t('h.levels').split('|').map(function (v, i) { v = v.trim(); var val = (vi[i] || v).trim(); return v ? '<option value="' + T.esc(val) + '">' + T.esc(v) + '</option>' : ''; }).join('');
  }
  var chosenFile = null;   // ảnh chuyển khoản đã chọn; giữ lại khi đổi ngôn ngữ (ô chọn file không đặt lại được bằng code)

  T.views.home = {
    render: function (root) {
      var s = T.session.get();
      chosenFile = null;
      root.innerHTML = T.topbar(topBtn(s)) + T.skeleton(4);
      // Nút Đăng nhập, Vào cổng bấm được ngay cả khi trang chủ còn đang tải (soát 20/10).
      var gl0 = T.$('#go-login', root); if (gl0) gl0.onclick = function () { T.go('login'); };
      var gp0 = T.$('#go-portal', root); if (gp0) gp0.onclick = function () { var s2 = T.session.get(); T.go(s2 && s2.role === 'TUTOR' ? 'tutor' : 'student'); };
      T.api('apiPublicInfo').then(function (r) {
        if (T.state.page !== 'home') return;   // đã sang trang khác (bấm Đăng nhập) trước khi có kết quả: không vẽ đè (soát 20/10)
        if (!r.ok) { root.innerHTML = T.topbar() + '<div class="alert bad">' + T.esc(r.message) + '</div>'; return; }
        T.state.info = r.data;
        draw(root, r.data, s);
      });
    },
    /** Đổi ngôn ngữ: vẽ lại bằng dữ liệu đã có, giữ chữ đã nhập trong form. */
    relabel: function (root) {
      if (!T.state.info || !T.$('#reg', root)) return T.views.home.render(root);
      var keep = {}, ids = ['f-name', 'f-email', 'f-phone'];
      ids.forEach(function (id) { var el = T.$('#' + id, root); if (el) keep[id] = el.value; });
      var lv = T.$('#f-level', root), pk = T.$('input[name=pkg]:checked', root), cs = T.$('#f-consent', root);
      var lvIdx = lv ? lv.selectedIndex : 0, pkVal = pk ? pk.value : '', csOn = cs ? cs.checked : false;
      draw(root, T.state.info, T.session.get());
      ids.forEach(function (id) { var el = T.$('#' + id, root); if (el && keep[id]) el.value = keep[id]; });
      if (T.$('#f-level', root)) T.$('#f-level', root).selectedIndex = Math.max(0, lvIdx);
      var p2 = pkVal && T.$('#pkg-' + pkVal, root); if (p2) { p2.checked = true; T.$$('.pkg', root).forEach(function (l) { l.classList.toggle('on', l.contains(p2)); }); }
      if (T.$('#f-consent', root)) T.$('#f-consent', root).checked = csOn;
      if (chosenFile) { T.$('#f-file-label', root).textContent = T.t('a.file_chosen', { name: chosenFile.name }); T.$('#f-file-box', root).classList.add('has'); }
      var ph = T.$('#f-phone', root); if (ph && ph.value) ph.oninput();
    }
  };

  function draw(root, info, s) {
    // 5K (BL06): gói giá 0 không chọn được, chỉ có nút Zalo admin.
    var paid = info.packages.filter(function (p) { return p.price > 0; }), contact = info.packages.filter(function (p) { return !(p.price > 0); });
    var pk = paid.map(function (p, i) {
      return '<label class="pkg' + (i === 0 ? ' on' : '') + '" for="pkg-' + p.code + '"><span class="row" style="flex-wrap:nowrap;gap:12px">' +
        '<input type="radio" name="pkg" id="pkg-' + p.code + '" value="' + T.esc(p.code) + '"' + (i === 0 ? ' checked' : '') + '>' +
        '<span><b>' + T.esc(T.pkgName(p)) + '</b><br><span class="meta">' + T.esc(pkgMeta(p)) + '</span></span></span>' +
        '<span class="price">' + T.money(p.price) + '</span></label>';
    }).join('') + contact.map(T.pkgContact).join('') + (paid.length ? '' : '<div class="alert warn">' + T.t('a.pkg_none') + '</div>');
    var bank = info.bank && info.bank.account
      ? '<div class="panel stack"><span class="eyebrow">' + T.t('h.bank_title') + '</span><div class="mono">' + T.esc(info.bank.name) + ' · ' + T.esc(info.bank.account) + '<br>' + T.esc(info.bank.holder) + '</div>' +
        '<small>' + T.t('h.bank_note') + '</small></div>'
      : '';
    root.innerHTML = T.topbar(topBtn(s)) +
      '<main class="stack-lg">' +
      '<section class="hero"><img class="hero-img" alt="" src="' + HERO_IMG + '"><span class="th-word" lang="th">' + T.t('h.hero_th') + '</span><h1>' + T.t('h.hero_title') + '</h1>' +
      '<p class="muted">' + T.t('h.hero_sub') + '</p></section>' +
      '<div class="facts"><div><b>' + T.t('h.fact1_big') + '</b><span>' + T.t('h.fact1') + '</span></div><div><b>' + T.t('h.fact2_big') + '</b><span>' + T.t('h.fact2') + '</span></div>' + (info.bookingLeadHours >= 0 ? '<div><b>' + (info.bookingLeadHours ? info.bookingLeadHours + 'h' : T.t('h.fact3_lead_zero')) + '</b><span>' + T.t('h.fact3_lead') + '</span></div>' : '<div><b>15:00</b><span>' + T.t('h.fact3_deadline') + '</span></div>') + '</div>' +
      '<form id="reg" class="card stack" novalidate>' +
      '<h2>' + T.t('h.form_title') + '</h2>' +
      '<div class="pkg-list" role="radiogroup" aria-label="' + T.esc(T.t('h.pkg_aria')) + '">' + pk + '</div>' +
      '<label class="field" for="f-name">' + T.t('h.f_name') + '<input type="text" id="f-name" autocomplete="name" required></label>' +
      '<label class="field" for="f-email">' + T.t('h.f_email') + '<input type="email" id="f-email" autocomplete="email" inputmode="email" required><span class="hint">' + T.t('h.f_email_hint') + '</span></label>' +
      '<label class="field" for="f-phone">' + T.t('h.f_phone') + '<input type="text" id="f-phone" autocomplete="tel" inputmode="text" placeholder="' + T.esc(T.t('h.f_phone_ph')) + '"><span class="hint" id="f-phone-hint">' + T.t('h.f_phone_hint') + '</span></label>' +
      '<label class="field" for="f-level">' + T.t('h.f_level') + '<select id="f-level">' + levelOptions() + '</select></label>' +
      bank +
      '<label class="file" id="f-file-box" for="f-file"><input type="file" id="f-file" accept="image/*,application/pdf"><span id="f-file-label">' + T.t('a.file_label') + '</span></label>' +
      '<label class="check" for="f-consent"><input type="checkbox" id="f-consent"><span>' + T.t('h.f_consent') + '' +
      (T.safeUrl(info.policyUrl) ? ' (<a href="' + T.esc(T.safeUrl(info.policyUrl)) + '" target="_blank" rel="noopener">' + T.t('h.f_policy') + '</a>)' : '') + '.</span></label>' +
      '<div class="hp" aria-hidden="true"><label for="f-website">Website</label><input type="text" id="f-website" tabindex="-1" autocomplete="off"></div>' +
      '<div id="reg-msg" hidden></div>' +
      '<button type="submit" class="btn btn-primary btn-block" id="reg-submit">' + T.t('h.f_submit') + '</button>' +
      '</form>' +
      '<section class="stack"><h3>' + T.t('h.help') + '</h3>' + T.contact(info.contact) + '</section>' +
      '</main>';
    bind(root);
    // Chunk 5G (soát R2 T13): đang bảo trì thì báo ngay trên form và khoá nút Gửi, không để khách điền rồi mới biết.
    var mm = T.boot.maint || {};
    if (mm.mode && mm.mode !== 'OFF') {
      showMsg(root, 'warn', T.esc(T.t(mm.mode === 'CLOSED' ? 'a.maint_closed' : 'a.maint_readonly', { until: mm.until ? ' (' + mm.until + ')' : '' })));
      T.$('#reg-submit', root).disabled = true;
    }
  }

  function bind(root) {
    var gl = T.$('#go-login', root); if (gl) gl.onclick = function () { T.go('login'); };
    var gp = T.$('#go-portal', root); if (gp) gp.onclick = function () { var s = T.session.get(); T.go(s && s.role === 'TUTOR' ? 'tutor' : 'student'); };
    T.$$('.pkg input', root).forEach(function (r) { r.onchange = function () { T.$$('.pkg', root).forEach(function (l) { l.classList.toggle('on', l.contains(T.$('input:checked', l))); }); }; });
    var phone = T.$('#f-phone', root), hint = T.$('#f-phone-hint', root);
    phone.oninput = function () {

      // Giờ đã chọn trước khi vẽ lại (đổi ngôn ngữ): giữ nguyên, ngày đó mở sẵn.
      Object.keys(st.sel).forEach(function (d) {
        var c = T.$('.chip[data-date="' + d + '"][data-slot="' + st.sel[d] + '"]', body);
        if (!c || c.disabled) { delete st.sel[d]; return; }
        c.classList.add('on'); c.setAttribute('aria-pressed', 'true'); var det = c.closest('details'); if (det) det.open = true;
      });
      updateBar(root);
      T.$$('.chip', body).forEach(function (c) {
        c.onclick = function () {
          var d = c.getAttribute('data-date'), s = c.getAttribute('data-slot');
          st.sel[d] = st.sel[d] === s ? undefined : s;
          if (!st.sel[d]) delete st.sel[d];
          T.$$('.chip[data-date="' + d + '"]', body).forEach(function (x) { var on = st.sel[d] === x.getAttribute('data-slot'); x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
          updateBar(root);
        };
      });
    }
  }
  function ruleNote(r) {
    r = r || {}; var c = (r.cutoffHour || 15) + ':00', k = (r.cancelHour || 15) + ':00';
    if (r.bookingLeadHours === 0) return '<p class="note">' + T.t('s.rule_until_start', { cancel: k }) + '</p>';
    return r.bookingLeadHours > 0
      ? '<p class="note">' + T.t('s.rule_lead', { hours: r.bookingLeadHours, cancel: k }) + '</p>'
      : '<p class="note">' + T.t('s.rule_day_before', { cutoff: c, cancel: k }) + '</p>';
  }
  function updateBar(root) {
    var n = Object.keys(st.sel).length, bar = T.$('#actionbar', root);
    bar.hidden = !n;
    T.$('#ab-text', root).textContent = T.t('s.bar_selected', { n: n });
    T.$('#ab-go', root).textContent = T.t('s.bar_book', { n: n });
  }
  function submitBooking(root) {
    var reqs = Object.keys(st.sel).sort().map(function (d) { return { date: d, slot: st.sel[d] }; });
    if (!reqs.length) return;
    var btn = T.$('#ab-go', root); btn.disabled = true; btn.textContent = T.t('s.booking');
    T.authed('apiStudentBook', reqs).then(function (r) {
      btn.disabled = false;
      st.days = null;   // slot đã đổi: lần sau đọc lại
      if (T.state.page !== 'student') return;   // người dùng đã rời trang trong lúc thử lại (soát R2 L5)
      if (!r.ok) { updateBar(root); T.toast(r.message || T.t('s.err_book')); if (r.uncertain) T.views.student.render(root, { tab: 'lessons' }); return; }
      var ok = r.data.filter(function (x) { return x.ok; }).length;
      var lines = r.data.map(function (x) {
        return '<div class="lesson">' + whenBox(x.date, x.slot) + '<div class="body">' +
          (x.ok ? '<span class="pill ok">' + T.t('s.res_ok') + '</span><span>' + T.t('s.tutor_prefix') + ' ' + T.esc(x.tutorName) + '</span>' : '<span class="pill bad">' + T.t('s.res_bad') + '</span><small>' + T.esc(T.m(x)) + '</small>') + '</div></div>';
      }).join('<hr class="list-divider">');
      T.sheet('<h2>' + (ok ? T.t('s.res_title_ok', { n: ok }) : T.t('s.res_title_none')) + '</h2>' + lines +
        (ok ? '<p class="muted">' + T.t('s.res_meet_note') + '</p>' : ''), [{ label: T.t('s.res_go_lessons'), kind: 'primary', value: 'lessons' }, { label: T.t('s.res_more'), value: 'book' }])
        .then(function (v) { st.tab = v || 'book'; T.views.student.render(root, { tab: st.tab }); });
    }).catch(function () { });
  }

  // ── Lịch của tôi ──
  function lessonRow(l, upcoming) {
    var pillKind = { CONFIRMED: 'ok', COMPLETED: '', STUDENT_ABSENT: 'warn', TECH_ISSUE: 'warn', TUTOR_ABSENT: 'warn' }[l.status];
    if (/^CANCELLED/.test(l.status)) pillKind = 'bad';
    var actions = '';
    if (upcoming) {
      actions = '<div class="row">' + (l.meetLink ? '<a class="btn btn-primary btn-sm" href="' + T.esc(T.safeUrl(l.meetLink)) + '" target="_blank" rel="noopener">' + T.t('s.join') + '</a>' : '<small class="muted">' + (l.inviteWhen ? T.t('s.meet_pending_at', { when: T.esc(l.inviteWhen) }) : T.t('s.meet_pending')) + '</small>') +
        (l.canCancel ? '<button class="btn btn-danger btn-sm" type="button" data-cancel="' + T.esc(l.bookingId) + '">' + T.t('s.cancel') + '</button>' : '<small>' + T.t('s.cancel_passed', { deadline: T.esc(l.cancelDeadline) }) + '</small>') + '</div>';
    }
    if (l.awaiting) pillKind = 'gold';
    return '<div class="lesson">' + whenBox(l.date, l.slot) + '<div class="body">' +
      '<div class="spread"><span>' + T.t('s.tutor_prefix') + ' <b>' + T.esc(l.tutorName) + '</b></span><span class="pill ' + (pillKind || '') + '">' + T.esc(statusLabel(l)) + '</span></div>' + actions + '</div></div>';
  }
  function drawLessons(body, root) {
    var h = st.home;
    body.innerHTML = '<div class="stack-lg"><section class="stack"><h2>' + T.t('s.upcoming') + '</h2>' +
      (h.upcoming.length ? '<div class="card stack">' + h.upcoming.map(function (l) { return lessonRow(l, true); }).join('<hr class="list-divider">') + '</div>' : '<div class="panel">' + T.t('s.upcoming_empty') + '</div>') +
      '</section><section class="stack"><h2>' + T.t('s.history') + '</h2>' +
      (h.history.length ? '<div class="card stack">' + h.history.map(function (l) { return lessonRow(l, false); }).join('<hr class="list-divider">') + '</div>' : '<p class="muted">' + T.t('s.history_empty') + '</p>') +
      '</section><section class="stack"><h3>' + T.t('s.tutor_issue') + '</h3>' + T.contact(h.contact) + '</section></div>';
    T.$$('[data-cancel]', body).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-cancel'), l = h.upcoming.filter(function (x) { return x.bookingId === id; })[0];
        T.sheet('<h2>' + T.t('s.cancel_q', { date: T.ddmm(l.date), slot: T.esc(l.slot) }) + '</h2><p class="muted">' + T.t('s.cancel_note') + '</p>',
          [{ label: T.t('s.cancel_yes'), kind: 'danger', value: true }, { label: T.t('s.cancel_no'), value: false }]).then(function (yes) {
          if (!yes) return;
          b.disabled = true; b.textContent = T.t('s.cancelling');   // khoá nút trong lúc gửi (có thể tự thử lại vài chục giây)
          T.authed('apiStudentCancel', id).then(function (r) {
            st.days = null;
            if (T.state.page !== 'student') return;
            T.toast(r.ok ? T.t('s.cancel_done', { date: T.ddmm(l.date), slot: l.slot }) : (r.message || T.t('s.err_cancel')));
            T.views.student.render(root, { tab: 'lessons' });
          }).catch(function () { });
        });
      };
    });
  }

  // ── Tài khoản và gia hạn ──
  function drawAccount(body, root, opts) {
    var p = st.home.profile;
    body.innerHTML = '<div class="stack-lg">' +
      '<form id="prof" class="card stack" novalidate><h2>' + T.t('s.me_title') + '</h2><small class="mono">' + T.esc(p.email) + '</small>' +
      '<label class="field" for="p-name">' + T.t('s.me_name') + '<input type="text" id="p-name" value="' + T.esc(p.name) + '"></label>' +
      '<label class="field" for="p-phone">' + T.t('s.me_phone') + '<input type="text" id="p-phone" autocomplete="tel" inputmode="text" value="' + T.esc(p.phoneDisplay) + '" placeholder="' + T.esc(T.t('s.me_phone_ph')) + '"></label>' +
      '<label class="field" for="p-level">' + T.t('s.me_level') + '<select id="p-level">' + T.levelOptions(p.level) + '</select></label>' +
      '<button class="btn btn-primary btn-block" type="submit">' + T.t('s.me_save') + '</button></form>' +
      '<form id="renew" class="card stack" novalidate><h2>' + T.t('s.renew_title') + '</h2><div id="renew-pkgs">' + T.skeleton(1) + '</div>' +
      '<div id="renew-bank"></div>' +
      (p.needsPhone ? '<label class="field" for="r-phone">' + T.t('s.me_phone') + '<input type="text" id="r-phone" autocomplete="tel" inputmode="text" placeholder="' + T.esc(T.t('s.me_phone_ph')) + '"></label>' : '') +
      '<label class="file" id="r-file-box" for="r-file"><input type="file" id="r-file" accept="image/*,application/pdf"><span id="r-file-label">' + T.t('a.file_label') + '</span></label>' +
      '<button class="btn btn-primary btn-block" type="submit" id="r-submit">' + T.t('s.renew_submit') + '</button>' +
      '<small>' + T.t('s.renew_note') + '</small></form>' +
      '<section class="stack"><h3>' + T.t('s.contact_title') + '</h3>' + T.contact(st.home.contact) + '</section>' +
      '<button class="btn btn-ghost btn-block" type="button" id="logout2">' + T.t('s.logout_full') + '</button></div>';
    T.$('#logout2', body).onclick = T.logout;
    T.$('#prof', body).onsubmit = function (e) {
      e.preventDefault();
      var ph = T.$('#p-phone', body).value;
      if (ph && !T.phone(ph)) { T.toast(T.t('a.err_phone')); return; }
      T.authed('apiStudentUpdateProfile', { name: T.$('#p-name', body).value, phone: ph, level: T.$('#p-level', body).value }).then(function (r) {
        T.toast(r.ok ? T.t('s.me_saved') : (r.message || T.t('s.err_save')));
        if (r.ok) load(root, { tab: 'account' });
      }).catch(function () { });
    };
    var file = T.$('#r-file', body);
    file.onchange = function () { var f = file.files[0]; renewFile = f || null; T.$('#r-file-label', body).textContent = f ? T.t('a.file_chosen', { name: f.name }) : T.t('a.file_label'); T.$('#r-file-box', body).classList.toggle('has', !!f); };
    var info = T.state.info;
    var withInfo = function (i) {
      T.state.info = i;
      var rp = i.packages.filter(function (x) { return x.code !== 'TRIAL'; });
      var rpaid = rp.filter(function (x) { return x.price > 0; });   // 5K (BL06): gói giá 0 chỉ có nút Zalo
      T.$('#renew-pkgs', body).innerHTML = '<div class="pkg-list">' + rpaid.map(function (x, k) {
        return '<label class="pkg' + (k === 0 ? ' on' : '') + '" for="r-' + x.code + '"><span class="row" style="flex-wrap:nowrap;gap:12px"><input type="radio" name="rpkg" id="r-' + x.code + '" value="' + x.code + '"' + (k === 0 ? ' checked' : '') + '><b>' + T.esc(T.pkgName(x)) + '</b></span><span class="price">' + T.money(x.price) + '</span></label>';
      }).join('') + rp.filter(function (x) { return !(x.price > 0); }).map(T.pkgContact).join('') + (rpaid.length ? '' : '<div class="alert warn">' + T.t('a.pkg_none') + '</div>') + '</div>';
      T.$$('#renew-pkgs input', body).forEach(function (r) { r.onchange = function () { T.$$('#renew-pkgs .pkg', body).forEach(function (l) { l.classList.toggle('on', l.contains(T.$('input:checked', l))); }); }; });
      if (i.bank && i.bank.account) T.$('#renew-bank', body).innerHTML = '<div class="panel mono">' + T.esc(i.bank.name) + ' · ' + T.esc(i.bank.account) + '<br>' + T.esc(i.bank.holder) + '</div>';
    };
    if (info) withInfo(info); else T.api('apiPublicInfo').then(function (r) { if (r.ok) withInfo(r.data); });
    T.$('#renew', body).onsubmit = function (e) {
      e.preventDefault();
      var f = file.files[0] || renewFile, code = T.$('input[name=rpkg]:checked', body);
      if (!code) return T.toast(T.t('s.renew_pick'));
      if (!f) return T.toast(T.t('a.err_file'));
      var rp = T.$('#r-phone', body);
      if (rp && !T.phone(rp.value)) return T.toast(T.t('a.err_phone'));
      var btn = T.$('#r-submit', body); btn.disabled = true; btn.textContent = T.t('a.sending');
      var release = T.hold();
      T.readUpload(f).then(function (shot) { return T.authed('apiStudentRenew', { package_code: code.value, screenshot: shot, phone: rp ? rp.value : undefined }); }).then(function (r) {
        btn.disabled = false; btn.textContent = T.t('s.renew_submit');
        if (!r.ok) return T.toast(r.message || T.t('a.err_send'));
        T.sheet('<h2>' + T.t('s.renew_done_title') + '</h2><p>' + T.t('s.renew_done_code') + '</p><p class="mono" style="font-size:1.2rem;font-weight:600">' + T.esc(r.data.transferCode) + '</p><p class="muted">' + T.t('s.renew_done_note') + '</p>');
      }).catch(function (err) { btn.disabled = false; btn.textContent = T.t('s.renew_submit'); if (err && err.message !== 'SESSION' && err.message !== 'MAINT') T.toast(err.message); }).then(release, release);
    };
    if (opts && opts.renew) T.$('#renew', body).scrollIntoView({ behavior: 'smooth' });
  }
})();
</script>

  <script>
/** Tutor.html · Cổng tutor: lịch dạy, giờ rảnh, xác nhận kết quả, số buổi. Mặc định tiếng Anh, đổi được bằng nút VI | EN (chunk 5H). */
(function () {
  var T = window.T;
  var ICON = {
    schedule: '<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    avail: '<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    user: '<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    check: '<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>'
  };
  var st = { tab: 'schedule', home: null, av: null, week: 1, dirty: {}, pick: {} };

  T.views.tutor = {
    render: function (root, opts) {
      st.tab = (opts && opts.tab) || st.tab || 'schedule';
      root.innerHTML = T.topbar() + T.skeleton(3);
      T.authed('apiTutorHome').then(function (r) {
        if (!r.ok) { root.innerHTML = T.topbar() + '<div class="alert bad">' + T.esc(r.message) + '</div>'; return; }
        st.home = r.data;
        T.adoptLang(r.data.profile && r.data.profile.lang);
        frame(root);
      }).catch(function () { });
    },
    /** Đổi ngôn ngữ: vẽ lại bằng dữ liệu đã có, giữ giờ rảnh chưa lưu và kết quả đang chọn. */
    relabel: function (root) { if (st.home) frame(root, true); else T.views.tutor.render(root, {}); }
  };
  /** Trình độ lưu tiếng Việt trong Sheets (h.levels bản vi): hiện bản cùng vị trí theo ngôn ngữ đang chọn; giá trị lạ hiện nguyên văn. */
  function levelLabel(v) {
    var vi = T.t('h.levels', null, 'vi').split('|').map(function (x) { return x.trim(); }), i = vi.indexOf(String(v).trim());
    var cur = T.t('h.levels').split('|'); return i !== -1 && cur[i] ? cur[i].trim() : v;
  }
  function whenBox(date, slot) { return '<div class="when"><span class="d">' + T.esc(T.dow(date, true)) + '</span><b>' + T.ddmm(date) + '</b>' + T.esc(slot) + '</div>'; }

  function frame(root, keep) {
    var h = st.home, n = h.schedule.toConfirm.length;
    root.innerHTML = T.topbar('<span class="who">' + T.esc(h.profile.name) + '</span><button class="btn btn-ghost btn-sm" type="button" id="logout">' + T.t('t.logout') + '</button>') +
      '<main class="stack-lg" id="tab-body"></main>' +
      '<div class="actionbar" id="actionbar" hidden><div class="inner"><span id="ab-text"></span><button class="btn btn-primary btn-sm" type="button" id="ab-go">' + T.t('t.save') + '</button></div></div>' +
      '<nav class="tabbar" aria-label="' + T.esc(T.t('t.nav_aria')) + '"><div class="inner">' +
      tabBtn('schedule', ICON.schedule, T.t('t.tab_schedule')) + tabBtn('avail', ICON.avail, T.t('t.tab_avail')) + tabBtn('confirm', ICON.check, T.t('t.tab_confirm'), n) + tabBtn('account', ICON.user, T.t('t.tab_account')) + '</div></nav>';
    T.$('#logout', root).onclick = T.logout;
    T.$$('.tab', root).forEach(function (b) { b.onclick = function () { st.tab = b.getAttribute('data-tab'); st.dirty = {}; st.pick = {}; frame(root); }; });
    T.$('#ab-go', root).onclick = function () { if (st.tab === 'confirm') reviewResults(root); else save(root); };
    var body = T.$('#tab-body', root);
    if (st.tab === 'schedule') drawSchedule(body);
    else if (st.tab === 'avail') { if (keep && st.av) { renderAvail(body, root); updateBar(root); } else drawAvail(body, root); }
    else if (st.tab === 'account') drawAccount(body, keep);
    else drawConfirm(body, root);
  }

  // ── Account: số buổi trong tháng (căn cứ tính lương). 16/10: bỏ danh sách thiết bị ──
  function drawAccount(body, keep) {
    body.innerHTML = '<section class="stack" id="stats"><h2>' + T.t('t.stats_title') + '</h2>' + T.skeleton(2) + '</section>' +
      '<button class="btn btn-ghost btn-block" type="button" id="logout2">' + T.t('t.logout') + '</button>';
    T.$('#logout2', body).onclick = T.logout;
    // Đổi ngôn ngữ: vẽ lại từ số đã tải, không gọi máy chủ (luật 50).
    var got = keep && st.stats ? Promise.resolve(st.stats) : T.authed('apiTutorStats');
    got.then(function (r) {
      if (r.ok) st.stats = r;
      var box = T.$('#stats', body);
      if (!r.ok) { box.innerHTML = '<div class="alert bad">' + T.esc(r.message) + '</div>'; return; }
      var rows = [['t.st_completed', 'completed'], ['t.st_absent', 'studentAbsent'], ['t.st_tech_paid', 'techPaid'], ['t.st_tech_unpaid', 'techUnpaid'], ['t.st_tutor_absent', 'tutorAbsent'], ['t.st_not_completed', 'notCompleted'], ['t.st_waiting', 'toConfirm']];
      if (st.tab !== 'account' || !T.$('#stats', body)) return;
      box.innerHTML = '<h2>' + T.t('t.stats_title') + '</h2>' + r.data.months.map(function (m) {
        return '<div class="card stack stats"><div class="spread"><b class="mono">' + T.esc(m.month) + '</b><span class="pill ok">' + T.t('t.st_payable') + ': ' + m.payable + '</span></div>' +
          rows.map(function (x) { return '<div class="spread"><span>' + T.t(x[0]) + '</span><b class="mono">' + m[x[1]] + '</b></div>'; }).join('') + '</div>';
      }).join('') + '<small class="muted">' + T.t('t.stats_note') + '</small>';
    }).catch(function () { });
  }
  function legend() {
    var cls = ['on', 'booked', 'pending', 'blocked', ''];
    return '<div class="legend">' + T.t('t.legend').split('|').map(function (x, i) { return '<span class="chip' + (cls[i] ? ' ' + cls[i] : '') + '" aria-hidden="true">' + T.esc(x.trim()) + '</span>'; }).join('') + '</div>';
  }
  function tabBtn(id, icon, label, count) { return '<button class="tab' + (st.tab === id ? ' on' : '') + '" type="button" data-tab="' + id + '"' + (st.tab === id ? ' aria-current="page"' : '') + '>' + icon + '<span>' + label + (count ? '<span class="count">' + count + '</span>' : '') + '</span></button>'; }

  function lessonRow(l, extra) {
    var s = l.student || {};
    // Chunk 5J: quá hạn chọn kết quả thì tô đỏ, ghi giờ sẽ thành Không hoàn thành.
    if (l.overdue) extra = '<div class="alert bad overdue">' + T.t('t.overdue', { at: T.esc(l.expireAt) }) + '</div>' + (extra || '');
    return '<div class="lesson' + (l.overdue ? ' is-overdue' : '') + '">' + whenBox(l.date, l.slot) + '<div class="body">' +
      '<div class="spread"><b>' + T.esc(s.name) + '</b>' + (s.level ? '<span class="pill">' + T.esc(levelLabel(s.level)) + '</span>' : '') + '</div>' +
      (s.note ? '<small>' + T.esc(s.note) + '</small>' : '') + (extra || '') + '</div></div>';
  }

  function drawSchedule(body) {
    var up = st.home.schedule.upcoming, late = st.home.schedule.toConfirm.filter(function (l) { return l.overdue; }).length;
    body.innerHTML = (late ? '<div class="alert bad" id="overdue-top">' + T.t('t.overdue_top', { n: late }) + ' <button class="btn btn-sm btn-primary" type="button" id="go-confirm">' + T.t('t.overdue_go') + '</button></div>' : '') +
      '<section class="stack"><div class="spread"><h2>' + T.t('t.upcoming') + '</h2><small class="mono">' + T.esc(st.home.now) + '</small></div>' +
      (up.length ? '<div class="card stack">' + up.map(function (l) {
        return lessonRow(l, l.meetLink ? '<div class="row"><a class="btn btn-primary btn-sm" href="' + T.esc(T.safeUrl(l.meetLink)) + '" target="_blank" rel="noopener">' + T.t('t.open_meet') + '</a></div>' : '<small class="muted">' + (l.inviteWhen ? T.t('t.meet_pending_at', { when: T.esc(l.inviteWhen) }) : T.t('t.meet_pending')) + '</small>');
      }).join('<hr class="list-divider">') + '</div>' : '<div class="panel">' + T.t('t.upcoming_empty') + '</div>') +
      '</section><section class="stack"><h3>' + T.t('t.help') + '</h3>' + T.contact(st.home.contact) + '</section>';
    var gc = T.$('#go-confirm', body);
    if (gc) gc.onclick = function () { var b = document.querySelector('.tab[data-tab="confirm"]'); if (b) b.click(); };
  }

  // ── Availability ──
  function parseNow(s) { var m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/); return m ? { key: m[3] + '-' + m[2] + '-' + m[1], hm: m[4] + ':' + m[5] } : { key: '', hm: '' }; }
  function addDaysKey(key, n) { var p = key.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dowOf(key) { return T.dow(key, true); }

  function drawAvail(body, root) {
    body.innerHTML = '<h2>' + T.t('t.avail_title') + '</h2>' + T.skeleton(3);
    T.authed('apiTutorAvailability', '', 14).then(function (r) {
      if (!r.ok) { body.innerHTML = '<div class="alert bad">' + T.esc(r.message) + '</div>'; return; }
      st.av = r.data; st.dirty = {};
      renderAvail(body, root);
    }).catch(function () { });
  }

  function stateOf(key) {
    if (key in st.dirty) return st.dirty[key] ? 'on' : 'off';
    var it = st.av.map[key];
    if (!it) return 'off';
    if (it.status === 'BLOCKED') return 'blocked';
    if (it.status === 'CANCEL_PENDING') return 'pending';
    return it.booked ? 'booked' : 'on';
  }

  function renderAvail(body, root) {
    var av = st.av, now = parseNow(av.now);
    av.map = {}; av.items.forEach(function (it) { av.map[it.date + '|' + it.slot] = it; });
    var w = av.weeks[st.week] || av.weeks[0];
    var days = []; for (var i = 0; i < 7; i++) days.push(addDaysKey(w.monday, i));
    body.innerHTML = '<div class="stack"><div class="spread"><h2>' + T.t('t.avail_title') + '</h2><div class="row">' +
      av.weeks.map(function (wk, i) { return '<button type="button" class="btn btn-sm ' + (i === st.week ? 'btn-primary' : 'btn-ghost') + '" data-week="' + i + '">' + T.t(i === 0 ? 't.this_week' : 't.next_week') + '</button>'; }).join('') + '</div></div>' +
      '<p class="note">' + T.t('t.deadline', { week: T.ddmm(w.monday), deadline: T.esc(w.deadline) }) + T.t(w.deadlinePassed ? 't.deadline_passed' : 't.deadline_open') + '</p>' +
      legend() + '<div class="week-grid">' +
      days.map(function (k, i) {
        var past = k < now.key;
        return '<details class="day"' + (i < 2 && !past ? ' open' : '') + '><summary><b>' + dowOf(k) + ' ' + T.ddmm(k) + '</b><span class="muted" style="font-size:.82rem" data-count="' + k + '"></span></summary>' +
          '<div class="slots">' + av.slots.map(function (s) {
            var key = k + '|' + s, dis = past || (k === now.key && s <= now.hm);
            return '<button type="button" class="chip" data-key="' + key + '"' + (dis ? ' disabled' : '') + '>' + s + '</button>';
          }).join('') + '</div>' +
          (past ? '' : '<div class="copy" style="padding:0 14px 14px"><button type="button" class="btn btn-ghost btn-sm" data-copy="' + k + '">' + T.t('t.copy_day') + '</button></div>') + '</details>';
      }).join('') + '</div></div>';
    if (T.wide()) T.$$('details.day', body).forEach(function (d) { d.open = true; });
    paint(body);
    T.$$('[data-week]', body).forEach(function (b) { b.onclick = function () { st.week = Number(b.getAttribute('data-week')); st.dirty = {}; updateBar(root); renderAvail(body, root); }; });
    T.$$('.chip[data-key]', body).forEach(function (c) { c.onclick = function () { tap(c.getAttribute('data-key'), body, root); }; });
    T.$$('[data-copy]', body).forEach(function (b) {
      b.onclick = function () {
        var src = b.getAttribute('data-copy'), idx = days.indexOf(src);
        days.slice(idx + 1).forEach(function (k) {
          av.slots.forEach(function (s) {
            var want = ['on', 'booked', 'pending'].indexOf(stateOf(src + '|' + s)) !== -1, key = k + '|' + s, cur = stateOf(key);
            if (cur === 'booked' || cur === 'pending' || cur === 'blocked') return;
            setWant(key, want);
          });
        });
        paint(body); updateBar(root); T.toast(T.t('t.copied'));
      };
    });
  }

  /** Ghi thay đổi mong muốn; nếu trùng trạng thái gốc thì bỏ khỏi danh sách thay đổi. */
  function setWant(key, open) {
    var it = st.av.map[key], orig = it ? (it.status === 'OPEN' || it.status === 'CANCEL_PENDING') : false;
    if (it && it.status === 'CANCEL_PENDING' && open) { st.dirty[key] = true; return; }
    if (open === orig) delete st.dirty[key]; else st.dirty[key] = open;
  }

  function tap(key, body, root) {
    var cur = stateOf(key);
    if (cur === 'blocked') { T.toast(T.t('t.blocked')); return; }
    if (cur === 'booked' && !(key in st.dirty)) {
      T.sheet('<h2>' + T.t('t.cancel_q', { slot: T.esc(key.replace('|', ' ')) }) + '</h2><p class="muted">' + T.t('t.cancel_note') + '</p>',
        [{ label: T.t('t.cancel_yes'), kind: 'danger', value: true }, { label: T.t('t.cancel_no'), value: false }]).then(function (yes) {
        if (yes) { st.dirty[key] = false; paint(body); updateBar(root); }
      });
      return;
    }
    if (key in st.dirty) delete st.dirty[key];
    else setWant(key, cur === 'off' || cur === 'pending');
    paint(body); updateBar(root);
  }

  function paint(body) {
    var counts = {};
    T.$$('.chip[data-key]', body).forEach(function (c) {
      var key = c.getAttribute('data-key'), s = stateOf(key), orig = st.av.map[key];
      c.className = 'chip' + (s === 'on' ? ' on' : s === 'booked' ? ' booked' : s === 'pending' ? ' pending' : s === 'blocked' ? ' blocked' : '') + (key in st.dirty ? ' dirty' : '');
      if (orig && orig.booked && s === 'off') c.className = 'chip pending dirty';
      c.setAttribute('aria-pressed', s === 'off' ? 'false' : 'true');
      var d = key.split('|')[0];
      if (s !== 'off' && s !== 'blocked') counts[d] = (counts[d] || 0) + 1;
    });
    T.$$('[data-count]', body).forEach(function (el) { var n = counts[el.getAttribute('data-count')] || 0; el.textContent = n ? T.t('t.count_open', { n: n }) : T.t('t.count_off'); });
  }

  function updateBar(root) {
    var n = Object.keys(st.dirty).length, bar = T.$('#actionbar', root);
    if (!bar) return;
    bar.hidden = !n;
    T.$('#ab-text', root).textContent = T.t('t.changes', { n: n });
    T.$('#ab-go', root).textContent = T.t('t.save');
  }

  function save(root) {
    var changes = Object.keys(st.dirty).map(function (k) { var p = k.split('|'); return { date: p[0], slot: p[1], open: st.dirty[k] }; });
    if (!changes.length) return;
    var btn = T.$('#ab-go', root); btn.disabled = true; btn.textContent = T.t('t.saving');
    T.authed('apiTutorSetAvailability', changes).then(function (r) {
      btn.disabled = false;
      if (T.state.page !== 'tutor') return;
      if (!r.ok) {
        updateBar(root); T.toast(r.message || T.t('t.err_save'));
        if (r.uncertain) { st.dirty = {}; updateBar(root); drawAvail(T.$('#tab-body', root), root); }   // tải lại để thấy đúng đã lưu chưa
        return;
      }
      var c = { OPEN: 0, CANCELLED: 0, CANCEL_PENDING: 0, bad: 0 };
      r.data.forEach(function (x) { if (!x.ok) c.bad++; else if (c[x.state] !== undefined) c[x.state]++; });
      T.sheet('<h2>' + T.t('t.saved') + '</h2><ul style="margin:0;padding-left:18px">' +
        (c.OPEN ? '<li>' + T.t('t.saved_open', { n: c.OPEN }) + '</li>' : '') + (c.CANCELLED ? '<li>' + T.t('t.saved_removed', { n: c.CANCELLED }) + '</li>' : '') +
        (c.CANCEL_PENDING ? '<li>' + T.t('t.saved_pending', { n: c.CANCEL_PENDING }) + '</li>' : '') + (c.bad ? '<li>' + T.t('t.saved_bad', { n: c.bad }) + '</li>' : '') + '</ul>')
        .then(function () { st.dirty = {}; updateBar(root); drawAvail(T.$('#tab-body', root), root); });
    }).catch(function () { });
  }

  // ── Confirm results (chunk 5F: xác nhận 2 bước) ──
  // Bước 1: chọn kết quả cho từng buổi (bấm lại để bỏ chọn). Bước 2: xem lại danh sách rồi mới Lưu, một lượt gọi cho cả lô.
  // Kết quả là căn cứ tính lương; tutor không tự sửa được sau khi lưu, nên không lưu ngay khi bấm như trước.
  var RES = [['COMPLETED', 't.res_completed'], ['STUDENT_ABSENT', 't.res_absent'], ['TECH_ISSUE', 't.res_tech']];
  function resLabel(code) { for (var i = 0; i < RES.length; i++) if (RES[i][0] === code) return T.t(RES[i][1]); return code; }
  function drawConfirm(body, root) {
    var list = st.home.schedule.toConfirm;
    body.innerHTML = '<section class="stack"><h2>' + T.t('t.confirm_title') + '</h2><p class="muted">' + T.t('t.confirm_note', st.home.rules || { notice: 24, expire: 48 }) + '</p>' +
      (list.length ? '<div class="card stack">' + list.map(function (l) {
        return lessonRow(l, '<div class="row" role="group">' + RES.map(function (x) {
          return '<button class="chip" type="button" aria-pressed="false" data-res="' + x[0] + '" data-id="' + T.esc(l.bookingId) + '">' + T.t(x[1]) + '</button>';
        }).join('') + '</div>');
      }).join('<hr class="list-divider">') + '</div>' : '<div class="panel">' + T.t('t.confirm_empty') + '</div>') + '</section>';
    paintPicks(body);
    updateConfirmBar(root);
    T.$$('[data-res]', body).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-id'), res = b.getAttribute('data-res');
        if (st.pick[id] === res) delete st.pick[id]; else st.pick[id] = res;
        paintPicks(body); updateConfirmBar(root);
      };
    });
  }
  function paintPicks(body) {
    T.$$('[data-res]', body).forEach(function (b) {
      var on = st.pick[b.getAttribute('data-id')] === b.getAttribute('data-res');
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function updateConfirmBar(root) {
    var n = Object.keys(st.pick).length, bar = T.$('#actionbar', root);
    if (!bar) return;
    bar.hidden = !n;
    T.$('#ab-text', root).textContent = T.t('t.chosen', { n: n });
    T.$('#ab-go', root).textContent = T.t('t.save_results', { n: n });
  }
  function reviewResults(root) {
    var byId = {}; st.home.schedule.toConfirm.forEach(function (l) { byId[l.bookingId] = l; });
    var items = Object.keys(st.pick).filter(function (id) { return byId[id]; }).map(function (id) { return { bookingId: id, result: st.pick[id] }; });
    if (!items.length) return;
    T.sheet('<h2>' + T.t('t.review_title') + '</h2><p class="muted">' + T.t('t.review_note') + '</p><ul class="review" style="margin:0;padding-left:18px">' +
      items.map(function (it) { var l = byId[it.bookingId]; return '<li><b>' + T.esc(T.day(l.date)) + ' ' + T.esc(l.slot) + '</b> · ' + T.esc(l.student.name) + ': <b>' + T.esc(resLabel(it.result)) + '</b></li>'; }).join('') + '</ul>',
      [{ label: T.t('t.btn_save_confirm'), kind: 'primary', value: true }, { label: T.t('t.btn_back'), value: false }]).then(function (yes) {
      if (!yes) return;
      var btn = T.$('#ab-go', root); if (btn) { btn.disabled = true; btn.textContent = T.t('t.saving'); }
      T.authed('apiTutorSubmitResults', items).then(function (r) {
        if (btn) btn.disabled = false;
        if (T.state.page !== 'tutor') return;
        if (!r.ok) { updateConfirmBar(root); T.toast(r.message || T.t('t.err_save')); if (r.uncertain) { st.pick = {}; T.views.tutor.render(root, { tab: 'confirm' }); } return; }
        var bad = r.data.items.filter(function (x) { return !x.ok; });
        st.pick = {};
        var done = function () { T.views.tutor.render(root, { tab: 'confirm' }); };
        if (!bad.length) { T.toast(T.t('t.saved_results', { n: r.data.saved })); done(); return; }
        T.sheet('<h2>' + T.t('t.saved_results', { n: r.data.saved }) + '</h2><p>' + T.t('t.saved_some_bad', { n: bad.length }) + '</p><ul style="margin:0;padding-left:18px">' +
          bad.map(function (x) { var l = byId[x.bookingId] || {}; return '<li>' + T.esc((l.date ? T.day(l.date) : x.bookingId) + ' ' + (l.slot || '')) + ': ' + T.esc(T.m(x) || x.reason) + '</li>'; }).join('') + '</ul>').then(done);
      }).catch(function () { });
    });
  }
})();
</script>

  <script>
/**
 * Admin.html · Giao diện admin (chunk 5E): thông báo, tutor, học viên, đặt thay, huỷ, nhật ký.
 * Chunk 5H: thông báo gọn, mỗi thông báo một dòng (chấm màu theo mức, nội dung, giờ), gom theo ngày; bộ lọc là nút phân đoạn.
 * Chunk 5I: song ngữ (chữ ad.* trong tab CONTENT, nút VI | EN như cổng học viên, tutor); 6 ô số liệu đều bấm được;
 *   nhật ký mỗi dòng một dòng xem trước, bấm mở đọc đủ; đổi ngôn ngữ vẽ lại bằng dữ liệu đã có (không gọi lại máy chủ).
 *   Mở trang lần đầu dùng luôn danh sách thông báo apiAdminHome gửi kèm (bớt một lượt gọi máy chủ).
 */
(function () {
  var T = window.T;
  var L = function (k, v) { return T.t('ad.' + k, v); };
  var has = function (k) { var c = T.boot.content || {}; return c[k] !== undefined && c[k] !== null; };
  var LEVEL_CLS = { CRITICAL: 'bad', WARNING: 'warn', INFO: 'info' };
  // view: trang con đang mở trong khung (người, danh sách buổi, đặt thay), giữ dữ liệu để đổi ngôn ngữ không gọi lại máy chủ.
  var st = { tab: 'feed', home: null, people: null, filter: { unread: true, level: '' }, search: '', feed: null, log: null, logQ: { text: '', who: '' }, view: null,
    feedSeq: 0, feedLoading: false, logSeq: 0, logLoading: false };

  /** Trang không tải được: câu báo theo ngôn ngữ đang chọn (máy chủ gửi cả hai thứ tiếng) và nút Thử lại (soát 5I B7). */
  function drawErr(root) {
    // Vòng 2 N3: chữ ad.* chưa có khi trang chưa tải được: dùng chữ chung a.* (có sẵn trong trang), dựng lại câu báo theo ngôn ngữ mỗi lần vẽ.
    var e = st.err, msg = e.reason === 'NETWORK' ? T.t('a.network_error') : (e.msg ? T.m(e) : e.reason === 'SERVER_ERROR' ? T.t('a.no_response') : e.message);
    root.innerHTML = T.topbar() + '<main class="stack-lg admin">' + alertBad(msg) + '<button class="btn btn-primary" type="button" id="retry">' + T.esc(T.t('a.retry')) + '</button></main>';
    T.$('#retry', root).onclick = function () { T.views.admin.render(root, {}); };
  }
  function sameQ(a, b) { return !!a && !!b && !!a.unread === !!b.unread && String(a.level || '') === String(b.level || ''); }
  function alertBad(msg) { return '<div class="alert bad">' + T.esc(msg) + '</div>'; }

  T.views.admin = {
    render: function (root, opts) {
      opts = opts || {};
      if (opts.tab) st.tab = opts.tab;
      if (opts.filter) st.filter = { unread: !!opts.filter.unread, level: opts.filter.level || '' };
      st.view = null;
      root.innerHTML = T.topbar() + T.skeleton(3);
      st.err = null;
      T.authed('apiAdminHome').then(function (r) {
        if (!r.ok) { st.err = r; drawErr(root); return; }
        st.home = r.data;
        // Chữ của trang admin (ad.*) đến cùng dữ liệu, không nằm trong trang chung của học viên, tutor.
        var c = T.boot.content = T.boot.content || {}; Object.keys(r.data.content || {}).forEach(function (k) { c[k] = r.data.content[k]; });
        T.adoptLang(r.data.me && r.data.me.lang);
        st.feed = sameQ(st.filter, r.data.feedQuery) ? { q: { unread: st.filter.unread, level: st.filter.level }, data: r.data.feed } : null;
        st.people = null; st.log = null;
        frame(root);
        if (opts.person) openPerson(root, opts.person);
      }).catch(function () { });
    },
    /** Đổi VI | EN: vẽ lại bằng dữ liệu đã có, giữ tab, trang con, bộ lọc, chữ đang gõ, giờ đã chọn khi đặt thay. */
    relabel: function (root) {
      if (!st.home) { if (st.err) drawErr(root); else root.innerHTML = T.topbar() + T.skeleton(3); return; }
      var q = T.$('#q', root), lq = T.$('#log-q', root);
      if (q) st.search = q.value;
      if (lq) st.logQ.text = lq.value;
      frame(root, true);
    }
  };

  // ── Nhãn theo ngôn ngữ ──
  function levelLabel(lv) { return has('ad.lv.' + lv) ? L('lv.' + lv) : lv; }
  function evLabel(ev) { return has('ad.ev.' + ev) ? L('ev.' + ev) : ev; }
  function actLabel(a) {
    a = String(a || '');
    if (has('ad.act.' + a)) return L('act.' + a);
    var m = a.match(/^(PACKAGE|MAINTENANCE)_(.+)$/);
    if (m && has('ad.act.' + m[1] + '_')) return L('act.' + m[1] + '_', { x: m[1] === 'PACKAGE' ? pkgStatus(m[2]) : (has('ad.maint.' + m[2]) ? L('maint.' + m[2]) : m[2]) });
    return a;
  }
  /** Màu nhãn trạng thái buổi, cùng hệ với cổng học viên: xác nhận xanh, huỷ đỏ, chờ tutor tím (thiết kế 20/10). */
  // Chunk 5J: buổi quá hạn chọn kết quả tô đỏ, nhãn "Quá hạn xác nhận".
  function statusCls(b) { return b.overdue ? ' bad' : b.awaiting ? ' gold' : b.status === 'CONFIRMED' ? ' ok' : /^CANCELLED/.test(String(b.status || '')) || b.status === 'NOT_COMPLETED' ? ' bad' : ''; }
  function statusLabel(b) { return b.overdue ? L('st.overdue') : b.awaiting ? L('st.awaiting') : has('ad.st.' + b.status) ? L('st.' + b.status) : b.status; }
  function pkgStatus(s) { return has('ad.pkg.' + s) ? L('pkg.' + s) : s; }
  function userStatus(s) { return has('ad.us.' + s) ? L('us.' + s) : s; }
  function pkgName(p) { return T.pkgName(p); }
  function msgOf(n) { return T.lang === 'en' && n.messageEn ? n.messageEn : n.message; }
  function pairOf(p, fallback) { return p && typeof p === 'object' ? (p[T.lang] || p.vi || fallback || '') : (fallback || ''); }
  function actorShort(a) { a = String(a || ''); return !a || a === 'SYSTEM' ? L('system') : a === 'ADMIN' ? L('admin_sheets') : a.split('@')[0]; }

  /** "dd/MM/yyyy HH:mm" (máy chủ gửi) thành nhóm ngày và giờ để gom: Hôm nay, Hôm qua, hoặc ngày. */
  function splitTime(s) { var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2})/); return m ? { day: m[3] + '-' + m[2] + '-' + m[1], hm: m[4] } : { day: '', hm: String(s || '') }; }
  function dayTitle(key, todayKey) {
    if (!key) return L('day_unknown');
    if (key === todayKey) return L('today');
    var p = todayKey.split('-'), y = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]) - 1)), yk = y.toISOString().slice(0, 10);
    return key === yk ? L('yesterday') : T.day(key);
  }
  function todayKey() { return (st.home && st.home.today) || splitTime(st.home && st.home.now).day || new Date().toISOString().slice(0, 10); }
  /** Gom danh sách (mới nhất trước) theo ngày: rowFn vẽ một dòng. */
  function grouped(items, rowFn, withGroups) {
    var today = todayKey(), last = null, out = '';
    items.forEach(function (n) {
      var d = splitTime(n.time).day;
      if (withGroups && d !== last) { out += '<div class="fgroup">' + T.esc(dayTitle(d, today)) + '</div>'; last = d; }
      out += rowFn(n);
    });
    return out;
  }

  // ── Khung trang: ô số liệu, thanh tab ──
  /**
   * Ô số liệu. Mọi ô bấm được: ô có link mở đúng tab Sheets (đăng ký chờ duyệt, tutor xin huỷ); ô khác lọc thông báo
   * hoặc mở danh sách buổi ngay trên trang. Link Sheets chưa có (hiếm): bấm hiện câu hướng dẫn.
   */
  function kpi(id, n, kind, act, href) {
    var cls = 'kpi' + (n && kind ? ' ' + kind : ''), url = href ? T.safeUrl(href) : '';
    var inner = '<b class="mono">' + n + '</b><span>' + T.esc(L('kpi.' + id)) + (url ? '\u00a0↗' : '\u00a0›') + '</span>';
    if (url) return '<a class="' + cls + '" href="' + T.esc(url) + '" target="_blank" rel="noopener" data-kpi-link="' + id + '">' + inner + '</a>';
    return '<button type="button" class="' + cls + '" data-kpi="' + (act || 'nolink:' + id) + '">' + inner + '</button>';
  }
  function kpis(u, c, l) {
    return kpi('critical', u.CRITICAL, 'bad', 'feed:CRITICAL') + kpi('warning', u.WARNING, 'warn', 'feed:WARNING') +
      kpi('regs', c.pendingRegistrations, 'warn', '', l.registrations || '-') + kpi('tutor_cancels', c.pendingTutorCancels, 'warn', '', l.availability || '-') +
      kpi('today', c.lessonsToday, '', 'lessons:today') + kpi('waiting', c.waitingResult, '', 'lessons:waiting');

  function bindKpis(root) {

      b.onclick = function () {

        if (a[0] === 'feed') { st.tab = 'feed'; st.view = null; st.filter = { unread: true, level: a[1] }; st.feed = null; frame(root); refreshCounts(root); window.scrollTo(0, 0); focusOn(root, '[data-kpi="' + b.getAttribute('data-kpi') + '"]'); }
        else if (a[0] === 'lessons') openLessons(root, a[1]);
